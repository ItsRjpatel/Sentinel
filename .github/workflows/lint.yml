name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Check code formatting with Black
      run: |
        cd backend
        black --check .
        
    - name: Check imports with isort
      run: |
        cd backend
        isort --check-only .
        
    - name: Lint with Ruff
      run: |
        cd backend
        ruff check .
        
    - name: Type check with mypy
      run: |
        cd backend
        mypy app
